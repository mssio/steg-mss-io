[package]
name = "steg-core"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rand_chacha = "=0.10.0"
rand_core = "0.10.1"
sha2 = "0.11.1"
pbkdf2 = { version = "0.13.0", features = ["hmac"] }
hkdf = "0.13.0"
aes-gcm = "0.11.1"
getrandom = "0.4.3"
wasm-bindgen = "0.2.130"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[profile.test]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
